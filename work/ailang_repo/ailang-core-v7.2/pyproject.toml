[project]
name = "ailang-core"
version = "5.4.0"
description = "AILang-Core: lenguaje + IR cognitivo + runtime verificado (FASE 0 + A/B/C + P1/P2/P3 + P3-9b/P3-1b/P2-10/P2-13/P2-14 completados)"
authors = [{ name = "Enrique Jimenez García" }]
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
crypto = ["cryptography"]
postgres = ["psycopg[binary]", "psycopg-pool"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ailang*"]

[tool.setuptools]
py-modules = ["ailang_core"]
