[project]
name = "ailang-core"
version = "5.2.0"
description = "AILang-Core: lenguaje + IR cognitivo + runtime verificado (FASE 0 + FASE A + B + C completados)"
authors = [{ name = "Enrique Jimenez García" }]
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
crypto = ["cryptography"]
postgres = ["psycopg[binary]", "psycopg-pool"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ailang*"]

[tool.setuptools]
py-modules = ["ailang_core"]
