<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AILang Playground</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
    header { background: #0f0f23; padding: 12px 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #2a2a4a; }
    header h1 { font-size: 20px; color: #00d4ff; }
    header .badge { background: #00d4ff22; color: #00d4ff; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    header .spacer { flex: 1; }
    header a { color: #8888bb; text-decoration: none; font-size: 14px; }
    header a:hover { color: #00d4ff; }
    .examples-bar { background: #12122a; padding: 8px 24px; display: flex; gap: 8px; overflow-x: auto; border-bottom: 1px solid #2a2a4a; }
    .examples-bar button { background: #1e1e3a; border: 1px solid #2a2a4a; color: #aaa; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .examples-bar button:hover { background: #2a2a4a; color: #00d4ff; border-color: #00d4ff44; }
    .examples-bar button.active { background: #00d4ff22; color: #00d4ff; border-color: #00d4ff; }
    .main { display: flex; flex: 1; overflow: hidden; }
    .editor-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #2a2a4a; }
    .output-panel { flex: 1; display: flex; flex-direction: column; background: #0f0f23; }
    .panel-header { padding: 8px 16px; font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #2a2a4a; display: flex; align-items: center; gap: 12px; }
    .toolbar { display: flex; gap: 8px; }
    .toolbar button { background: #00d4ff; color: #000; border: none; padding: 4px 16px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .toolbar button:hover { background: #00b8d4; }
    .toolbar button.secondary { background: #2a2a4a; color: #aaa; }
    .toolbar button.secondary:hover { background: #3a3a5a; color: #fff; }
    .toolbar select { background: #1e1e3a; color: #aaa; border: 1px solid #2a2a4a; padding: 4px 8px; border-radius: 4px; font-size: 13px; }
    .CodeMirror { flex: 1 !important; height: 100% !important; font-size: 14px; font-family: 'Fira Code', 'Consolas', monospace; }
    .output-content { flex: 1; padding: 16px; overflow: auto; font-family: 'Fira Code', 'Consolas', monospace; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
    .output-content .stdout { color: #e0e0e0; }
    .output-content .stderr { color: #ff6b6b; }
    .output-content .result { color: #00d4ff; font-weight: bold; padding-top: 8px; border-top: 1px solid #2a2a4a; margin-top: 8px; }
    .output-content .error { color: #ff6b6b; }
    .output-content .info { color: #8888bb; font-style: italic; }
    .status-bar { background: #0f0f23; padding: 4px 24px; font-size: 12px; color: #555; border-top: 1px solid #2a2a4a; display: flex; gap: 16px; }
    .status-bar .ok { color: #51cf66; }
    .status-bar .fail { color: #ff6b6b; }
    .loading { color: #8888bb; font-style: italic; }
  </style>
</head>
<body>
  <header>
    <h1>⚡ AILang Playground</h1>
    <span class="badge">v1.1.0</span>
    <div class="spacer"></div>
    <a href="https://github.com/ailang/ailang-core" target="_blank">GitHub</a>
    <a href="/docs/TUTORIAL.md" target="_blank">Tutorial</a>
    <a href="/docs/LANGUAGE_REFERENCE.md" target="_blank">Reference</a>
  </header>

  <div class="examples-bar" id="examplesBar"></div>

  <div class="main">
    <div class="editor-panel">
      <div class="panel-header">
        <span>Source</span>
        <div class="spacer"></div>
        <div class="toolbar">
          <select id="backendSelect">
            <option value="interp">Interpreter</option>
            <option value="vm" selected>VM</option>
            <option value="air">AIR + Capabilities</option>
          </select>
          <button class="secondary" onclick="formatCode()">Format</button>
          <button onclick="runCode()">▶ Run</button>
        </div>
      </div>
      <textarea id="editor"></textarea>
    </div>
    <div class="output-panel">
      <div class="panel-header">
        <span>Output</span>
        <div class="spacer"></div>
        <div class="toolbar">
          <button class="secondary" onclick="clearOutput()">Clear</button>
        </div>
      </div>
      <div class="output-content" id="output"><span class="info">Press Run to execute...</span></div>
    </div>
  </div>

  <div class="status-bar">
    <span id="statusText">Ready</span>
    <span id="execTime"></span>
    <span id="backendInfo"></span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script>
    // AILang syntax highlighting mode for CodeMirror
    CodeMirror.defineMode('ailang', function() {
      var keywords = ['let','const','fn','if','else','while','for','in','return','class','extends',
        'import','try','catch','throw','as','self','super','break','continue','match','case',
        'enum','async','await','yield','interface','record','spawn','implements','purge_after',
        'and','or','not'];
      var types = ['int','float','bool','string','null','any','List','Dict','Tuple','Set',
        'Function','Future','Generator','Channel','Tensor','Optional','Union'];
      var builtins = ['print','len','str','int','float','range','type','isinstance','implements','channel','iter','next'];
      return {
        startState: function() { return { inString: false, inComment: false, stringChar: null }; },
        token: function(stream, state) {
          if (state.inString) {
            if (stream.match(state.stringChar)) { state.inString = false; return 'string'; }
            stream.next(); return 'string';
          }
          if (state.inComment) {
            if (stream.match('*/')) { state.inComment = false; return 'comment'; }
            stream.next(); return 'comment';
          }
          if (stream.match('//')) { stream.skipToEnd(); return 'comment'; }
          if (stream.match('/*')) { state.inComment = true; return 'comment'; }
          if (stream.match('"') || stream.match("'")) {
            state.inString = true; state.stringChar = stream.current();
            return 'string';
          }
          if (stream.match(/\$\{[^}]+\}/)) return 'variable-2';
          if (stream.match(/[0-9]+\.[0-9]+/)) return 'number';
          if (stream.match(/[0-9]+/)) return 'number';
          if (stream.match(/[a-zA-Z_][a-zA-Z0-9_]*/)) {
            var word = stream.current();
            if (keywords.includes(word)) return 'keyword';
            if (types.includes(word)) return 'variable-2';
            if (builtins.includes(word)) return 'builtin';
            if (word === 'true' || word === 'false') return 'atom';
            if (word === 'null') return 'atom';
            return 'variable';
          }
          stream.next();
          return null;
        }
      };
    });

    var editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
      mode: 'ailang',
      theme: 'dracula',
      lineNumbers: true,
      indentUnit: 2,
      tabSize: 2,
      autoCloseBrackets: true,
      matchBrackets: true,
    });

    var examples = [
      { name: 'Hello World', code: 'print("hello from AILang!")' },
      { name: 'Fibonacci', code: 'fn fib(n) {\n  if n < 2 { return n }\n  return fib(n - 1) + fib(n - 2)\n}\n\nlet result = fib(10)\nprint("fib(10) = " + str(result))\nresult' },
      { name: 'Closures', code: 'fn make_counter() {\n  let count = 0\n  fn inc() {\n    count = count + 1\n    return count\n  }\n  return inc\n}\n\nlet c = make_counter()\nc()\nc()\nc()\nprint("counter: " + str(c()))\nc()' },
      { name: 'Classes', code: 'class Animal {\n  fn init(name) { self.name = name }\n  fn speak() { return "generic sound" }\n}\n\nclass Dog extends Animal {\n  fn speak() { return "woof" }\n}\n\nlet d = Dog("Rex")\nprint(d.name + " says " + d.speak())\nd.speak()' },
      { name: 'Generators', code: 'fn gen() {\n  yield 1\n  yield 2\n  yield 3\n  yield 4\n  yield 5\n}\n\nlet total = 0\nfor n in gen() {\n  total = total + n\n  print("got: " + str(n))\n}\nprint("total: " + str(total))\ntotal' },
      { name: 'Channels', code: 'let c = channel()\nc.send(42)\nc.send("hello")\nprint(str(c.recv()))\nprint(c.recv())\nlet result = c.recv()\nresult' },
      { name: 'Records', code: 'record Point { x, y }\n\nlet p = Point(3, 4)\nprint("x=" + str(p.x) + " y=" + str(p.y))\np.x + p.y' },
      { name: 'Enums', code: 'enum Color { RED, GREEN, BLUE }\n\nprint(Color.RED == Color.RED)\nprint(Color.RED == Color.GREEN)\nColor.RED == Color.RED' },
      { name: 'Try-Catch', code: 'try {\n  throw "something broke!"\n} catch e {\n  print("caught: " + e)\n  e\n}' },
      { name: 'Strings', code: 'let name = "Ada"\nlet age = 30\nprint("Name: ${name}, Age: ${age}")\n"hello ${name}!"' },
      { name: 'Crypto', code: 'import crypto\n\nlet hash = crypto.sha256("hello world")\nprint("SHA-256: " + hash)\n\nlet kp = crypto.generate_keypair()\nlet sig = crypto.sign(kp["private"], "message")\nlet valid = crypto.verify(kp["public"], sig, "message")\nprint("signature valid: " + str(valid))\nvalid' },
      { name: 'Tensor', code: 'import tensor\n\nlet a = tensor.tensor([[1, 2], [3, 4]], true)\nlet b = tensor.tensor([[5, 6], [7, 8]], true)\nlet c = a.matmul(b)\nlet loss = c.sum()\nloss.backward()\nprint("matmul result:")\nprint(c)\nprint("gradient:")\nprint(a.grad.tolist())\nloss.item()' },
      { name: 'Capabilities', code: '// This program requires capabilities\n// Run with AIR backend to verify\nimport io\nimport sys\n\nprint("platform: " + sys.platform())\nprint("AILang version: " + sys.version())\n"OK"' },
    ];

    var examplesBar = document.getElementById('examplesBar');
    examples.forEach(function(ex, i) {
      var btn = document.createElement('button');
      btn.textContent = ex.name;
      btn.onclick = function() {
        editor.setValue(ex.code);
        document.querySelectorAll('.examples-bar button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      };
      examplesBar.appendChild(btn);
      if (i === 0) { btn.click(); }
    });

    function appendOutput(text, cls) {
      var output = document.getElementById('output');
      if (output.querySelector('.info') && output.children.length === 1 && output.children[0].className === 'info') {
        output.innerHTML = '';
      }
      var span = document.createElement('span');
      span.className = cls || 'stdout';
      span.textContent = text;
      output.appendChild(span);
      output.scrollTop = output.scrollHeight;
    }

    function clearOutput() {
      document.getElementById('output').innerHTML = '<span class="info">Output cleared.</span>';
    }

    function setStatus(text, cls) {
      var el = document.getElementById('statusText');
      el.textContent = text;
      el.className = cls || '';
    }

    async function runCode() {
      var code = editor.getValue();
      var backend = document.getElementById('backendSelect').value;
      var output = document.getElementById('output');
      output.innerHTML = '<span class="loading">Running...</span>';
      setStatus('Running...', '');

      var t0 = performance.now();
      try {
        var response = await fetch('/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source: code, backend: backend }),
        });
        var result = await response.json();
        var t1 = performance.now();

        output.innerHTML = '';
        if (result.stdout) appendOutput(result.stdout, 'stdout');
        if (result.stderr) appendOutput(result.stderr, 'stderr');
        if (result.result !== null && result.result !== undefined) {
          appendOutput('→ ' + JSON.stringify(result.result), 'result');
        }
        if (result.error) {
          appendOutput(result.error, 'error');
        }

        var elapsed = (t1 - t0).toFixed(1);
        document.getElementById('execTime').textContent = `${elapsed}ms`;
        document.getElementById('backendInfo').textContent = backend;
        setStatus(result.error ? 'Error' : 'OK', result.error ? 'fail' : 'ok');
      } catch (err) {
        output.innerHTML = '';
        appendOutput('Error: ' + err.message + '\n\nMake sure the AILang server is running:\n  python -m ailang --serve', 'error');
        setStatus('Connection failed', 'fail');
      }
    }

    function formatCode() {
      var code = editor.getValue();
      fetch('/api/format', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ source: code }),
      })
      .then(r => r.json())
      .then(result => {
        if (result.formatted) {
          editor.setValue(result.formatted);
          setStatus('Formatted', 'ok');
        }
      })
      .catch(err => {
        appendOutput('Format error: ' + err.message, 'error');
      });
    }

    editor.setOption('extraKeys', {
      'Ctrl-Enter': runCode,
      'Cmd-Enter': runCode,
      'Ctrl-S': formatCode,
    });
  </script>
</body>
</html>
