name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install cryptography
          pip install hypothesis
          pip install pytest pytest-cov

      - name: Install AILang (editable)
        run: pip install -e .

      - name: Run ailang doctor
        run: python -m ailang doctor

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run monolith embedded tests
        run: python ailang_core.py test

      - name: Run examples (regression smoke)
        run: |
          python -m ailang examples/core_demo.ailang
          python -m ailang examples/modules_demo.ailang
          python -m ailang examples/oop_demo.ailang
          python -m ailang examples/selftest.ailang

      - name: Verify version consistency
        run: |
          python -c "from ailang.versions import __version__; print('version:', __version__)"
          python -m ailang --version

  lint:
    name: Lint + Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy cryptography hypothesis pytest
      - run: pip install -e .
      - name: Self-lint (AILang linter on own examples)
        run: |
          python -m ailang lint examples/core_demo.ailang
          python -m ailang lint examples/modules_demo.ailang
      - name: Self-format check (format_ast idempotency)
        run: |
          python -c "
          from ailang.fmt import format_ast
          import pathlib
          for f in pathlib.Path('examples').glob('*.ailang'):
              src = f.read_text()
              out1 = format_ast(src)
              out2 = format_ast(out1)
              assert out1 == out2, f'format_ast no idempotente: {f}'
          print('format_ast idempotency: OK')
          "

  conformance:
    name: Conformance suite (interp ↔ VM parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy cryptography hypothesis pytest
      - run: pip install -e .
      - name: Run conformance suite
        run: python -m pytest tests/test_conformance.py tests/test_conformance_vm_parity.py -v
      - name: Run property-based tests
        run: python -m pytest tests/test_property_based.py -v
